name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build, Test, and Container Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t devops-practice-app:latest .

      - name: Start container
        run: |
          docker run -d --name test-container -p 8000:8000 devops-practice-app:latest

      - name: Run smoke test against /health
        run: |
          timeout 30s bash -c 'until curl -s -f http://localhost:8000/health; do sleep 1; done'
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Health check response: $RESPONSE"
          if [[ "$RESPONSE" == *"healthy"* ]]; then
            echo "Smoke test passed successfully."
          else
            echo "Smoke test failed!"
            exit 1
          fi

      - name: Stop and remove test container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
